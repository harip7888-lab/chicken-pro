<style>

body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header#top{position:sticky;top:0;z-index:5;background:var(--p);color:#fff;display:flex;align-items:center;gap:8px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top))}
#back{background:none;border:0;color:#fff;font-size:28px;line-height:1;padding:0 6px 2px 0;cursor:pointer}
.brand{font-weight:700;font-size:17px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.card{background:var(--card);border:1px solid var(--ln);border-radius:var(--r);padding:14px;margin-bottom:12px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
@media(min-width:720px){.kpis{grid-template-columns:repeat(4,1fr)}}

.kpi.hl{background:var(--p);border-color:var(--p);color:#fff}.kpi.hl span,.kpi.hl small{color:#FFEDD5}

.action{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--ln);border-radius:var(--r);padding:12px;text-decoration:none;color:inherit;min-height:72px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--ln);background:#fff;color:var(--tx);border-radius:12px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;min-height:46px;text-decoration:none}
.btn.primary{background:var(--p);border-color:var(--p);color:#fff}
.btn.danger{color:var(--bad);border-color:#FCA5A5}

.field{display:block;margin-bottom:12px}.field>span{display:block;font-size:13px;color:var(--mu);margin-bottom:4px}
input,select,textarea{width:100%;font:inherit;padding:11px 12px;border:1px solid #D6D3D1;border-radius:12px;background:#fff;color:var(--tx);min-height:48px}

input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--p)}
input.small{width:120px;text-align:right;min-height:40px;padding:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:600px){.grid2.r1{grid-template-columns:1fr}}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.gap>*{flex:1}

#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(20px);background:#1C1917;color:#fff;padding:10px 16px;border-radius:12px;opacity:0;transition:.25s;z-index:40;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}#toast.bad{background:var(--bad)}

.receipt .c{text-align:center}.receipt .r{display:flex;justify-content:space-between;gap:8px}.receipt hr{border:0;border-top:1px dashed #A8A29E;margin:6px 0}.receipt .big{font-size:16px;font-weight:700}

.big-num{font-size:28px;font-weight:800}
#printArea{display:none}
@media print{
  @page{margin:2mm}
  html,body{background:#fff;padding:0}

<body>
<header id="top" class="hidden"><button id="back" class="hidden" aria-label="Back">‹</button><div class="brand" id="shopName">RetailPro Mini</div><div id="net" class="net"></div></header>
<main id="view"><p class="center muted" style="margin-top:40vh">Loading…</p></main>

<div id="toast"></div>

<script>
'use strict';
/* ============================================================
   RetailPro Mini — mobile-first poultry shop POS
   1) Paste your Firebase web config below (Project settings → Your apps → Web app).
   2) Leave it as null to choose "Connect Firebase" or "Demo mode" on first open.
   ============================================================ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCjJEfHi8etRJi94zed1hdXXI0AS1vKFkU",
  authDomain: "chicken-pro.firebaseapp.com",
  projectId: "chicken-pro",
  storageBucket: "chicken-pro.firebasestorage.app",
  messagingSenderId: "589337210345",
  appId: "1:589337210345:web:4a66557f0a188061ab2f78"
};
/* Example:
const FIREBASE_CONFIG = {
  apiKey: "AIza...", authDomain: "your-project.firebaseapp.com", projectId: "your-project",
  storageBucket: "your-project.appspot.com", messagingSenderId: "1234567890", appId: "1:1234567890:web:abc123"
};
*/
const USER_DOMAIN = 'retailpro.local';   // usernames become  username@retailpro.local  in Firebase Auth
const VER = '1.1.0';
const FB_VER = '10.12.5';

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const r2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
const r3 = n => Math.round((n + Number.EPSILON) * 1000) / 1000;
const money = n => { const v = r2(num(n)); return (v < 0 ? '−₹' : '₹') + Math.abs(v).toLocaleString('en-IN', {minimumFractionDigits: 0, maximumFractionDigits: 2}); };
const pl = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
const qtyTxt = (q, u) => u === 'kg' ? r3(num(q)).toFixed(3) + ' kg' : r3(num(q)) + ' ' + (u || 'pc');
const pad = n => String(n).padStart(2, '0');
const dayKey = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const addDays = (k, n) => { const d = new Date(k + 'T00:00:00'); d.setDate(d.getDate() + n); return dayKey(d); };
const timeTxt = ms => new Date(ms).toLocaleTimeString('en-IN', {hour: '2-digit', minute: '2-digit'});
const dateTxt = k => new Date(k + 'T00:00:00').toLocaleDateString('en-IN', {day: '2-digit', month: 'short', year: 'numeric'});
const sum = (a, f) => r2((a || []).reduce((t, x) => t + num(typeof f === 'function' ? f(x) : x[f]), 0));
const okSale = s => s.status !== 'void';
const ls = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const INC = n => ({__inc: n});
const PAY = {cash: 'Cash', upi: 'UPI', credit: 'Credit'};
const PPAY = {cash: 'Cash', upi: 'UPI', bank: 'Bank'};
const ROLE = {owner: 'Owner', manager: 'Manager', cashier: 'Cashier'};
const CATS = {live: 'Live bird', dressed: 'Dressed', cut: 'Cut / special', offal: 'Offal', egg: 'Eggs', other: 'Other'};
const EXP_CATS = ['Rent', 'Salary', 'Electricity', 'Transport', 'Ice', 'Packaging', 'Gas / Water', 'Tea / Food', 'Maintenance', 'Other'];
const SEED = [
  {name: 'Live Chicken', unit: 'kg', cat: 'live', rate: 150, low: 20},
  {name: 'Chicken (With Skin)', unit: 'kg', cat: 'dressed', rate: 220, low: 5},
  {name: 'Chicken (Skinless)', unit: 'kg', cat: 'dressed', rate: 260, low: 5},
  {name: 'Boneless', unit: 'kg', cat: 'cut', rate: 380, low: 2},
  {name: 'Leg Piece', unit: 'kg', cat: 'cut', rate: 300, low: 2},
  {name: 'Wings', unit: 'kg', cat: 'cut', rate: 200, low: 1},
  {name: 'Liver & Gizzard', unit: 'kg', cat: 'offal', rate: 160, low: 1},
  {name: 'Country Chicken', unit: 'kg', cat: 'live', rate: 450, low: 5},
  {name: 'Eggs', unit: 'pc', cat: 'egg', rate: 7, low: 30}
];

function toast(msg, bad) { const t = $('#toast'); t.textContent = msg; t.className = 'show' + (bad ? ' bad' : ''); clearTimeout(t._h); t._h = setTimeout(() => t.className = '', 2800); }
function sheet(html) {
  closeSheet();
  const o = document.createElement('div'); o.className = 'overlay'; o.id = 'ov';
  o.innerHTML = `<div class="sheet" role="dialog">${html}</div>`;
  o.addEventListener('click', e => { if (e.target === o) closeSheet(); });
  document.body.appendChild(o); return o.firstElementChild;
}
function closeSheet() { const o = $('#ov'); if (o) o.remove(); }
function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Could not load ' + src)); document.head.appendChild(s); }); }
function downloadFile(name, content, type) {
  const blob = new Blob([content], {type}); const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function downloadCSV(name, rows) {
  const csv = rows.map(r => r.map(v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(',')).join('\n');
  downloadFile(name, '﻿' + csv, 'text/csv');
}
function deviceCode() { let c = ls.get('rpm_dev', null); if (!c) { c = 'M' + Math.floor(Math.random() * 90 + 10); ls.set('rpm_dev', c); } return c; }
function nextBillNo() {
  const d = dayKey(); const s = ls.get('rpm_seq', {}); const n = (s.day === d ? s.n : 0) + 1;
  ls.set('rpm_seq', {day: d, n});
  return `${deviceCode()}-${d.slice(2).replace(/-/g, '')}-${String(n).padStart(3, '0')}`;
}
function toEmail(u) { u = String(u || '').trim().toLowerCase(); return u.includes('@') ? u : `${u}@${USER_DOMAIN}`; }
function authMsg(e) {
  const c = (e && e.code) || '';
  const m = {
    'auth/invalid-credential': 'Wrong username or password', 'auth/wrong-password': 'Wrong username or password',
    'auth/user-not-found': 'Wrong username or password', 'auth/invalid-login-credentials': 'Wrong username or password',
    'auth/too-many-requests': 'Too many attempts. Please wait a few minutes.',
    'auth/network-request-failed': 'No internet. The first login on a phone needs internet.',
    'auth/email-already-in-use': 'That username is already taken', 'auth/weak-password': 'Password must be at least 6 characters',
    'auth/invalid-email': 'Username can only use letters, numbers, dot, dash or underscore',
    'auth/requires-recent-login': 'Please sign out and sign in again, then retry',
    'permission-denied': 'Not allowed. If the shop is already set up, ask the owner for a login.'
  };
  return m[c] || (e && e.message) || String(e);
}

/* ---------- data layer (Firebase or local demo) ---------- */
let DB, AUTH;
const CFG = FIREBASE_CONFIG || ls.get('rpm_fbcfg', null);
const MODE = CFG ? 'fb' : (ls.get('rpm_demo_on', false) ? 'demo' : 'setup');

function makeFB() {
  firebase.initializeApp(CFG);
  const db = firebase.firestore();
  db.enablePersistence({synchronizeTabs: true}).catch(e => console.warn('Offline persistence:', e.code));
  const FV = firebase.firestore.FieldValue;
  const conv = o => { const r = {}; for (const [k, v] of Object.entries(o)) r[k] = (v && typeof v === 'object' && '__inc' in v) ? FV.increment(v.__inc) : v; return r; };
  const q = (col, f = []) => f.reduce((qq, [a, op, v]) => qq.where(a, op, v), db.collection(col));
  const docs = s => s.docs.map(d => ({id: d.id, ...d.data()}));
  const onErr = col => e => { console.warn(col, e); if (e.code !== 'cancelled') toast('Sync problem (' + col + '): ' + (e.code || e.message), true); };
  return {
    newId: col => db.collection(col || 'x').doc().id,
    put: (col, id, data, merge) => db.collection(col).doc(id).set(conv(data), {merge: !!merge}),
    patch: (col, id, data) => db.collection(col).doc(id).update(conv(data)),
    batch: ops => {
      const b = db.batch();
      ops.forEach(o => { const ref = db.collection(o.col).doc(o.id); if (o.type === 'put') b.set(ref, conv(o.data), {merge: !!o.merge}); else b.update(ref, conv(o.data)); });
      return b.commit();
    },
    watch: (col, f, cb) => q(col, f).onSnapshot({includeMetadataChanges: true}, s => cb(docs(s), s.docs.filter(d => d.metadata.hasPendingWrites).length), onErr(col)),
    watchDoc: (col, id, cb) => db.collection(col).doc(id).onSnapshot(d => cb(d.exists ? {id: d.id, ...d.data()} : null, d.metadata.fromCache), onErr(col)),
    fetch: (col, f) => q(col, f).get().then(docs),
    getDoc: (col, id) => db.collection(col).doc(id).get().then(d => d.exists ? {id: d.id, ...d.data()} : null)
  };
}

function makeDemo() {
  let data = ls.get('rpm_demo', {});
  const subs = new Set();
  const persist = () => { ls.set('rpm_demo', data); subs.forEach(s => { try { s(); } catch (e) { console.error(e); } }); };
  const coll = c => (data[c] = data[c] || {});
  const apply = (old, o) => { const r = {...(old || {})}; for (const [k, v] of Object.entries(o)) r[k] = (v && typeof v === 'object' && '__inc' in v) ? r3(num(r[k]) + v.__inc) : v; return r; };
  const ok = (d, f = []) => f.every(([a, op, v]) => op === '==' ? d[a] === v : op === '>=' ? d[a] >= v : op === '<=' ? d[a] <= v : true);
  const list = (c, f) => Object.entries(coll(c)).map(([id, d]) => ({id, ...d})).filter(d => ok(d, f));
  const write = o => { const c = coll(o.col); if (o.type === 'put') c[o.id] = o.merge ? apply(c[o.id], o.data) : apply({}, o.data); else { if (!c[o.id]) throw new Error('Record not found'); c[o.id] = apply(c[o.id], o.data); } };
  return {
    newId: () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
    put: (col, id, d, merge) => { write({type: 'put', col, id, data: d, merge}); persist(); return Promise.resolve(); },
    patch: (col, id, d) => { try { write({type: 'patch', col, id, data: d}); } catch (e) { return Promise.reject(e); } persist(); return Promise.resolve(); },
    batch: ops => { try { ops.forEach(write); } catch (e) { return Promise.reject(e); } persist(); return Promise.resolve(); },
    watch: (col, f, cb) => { const run = () => cb(list(col, f), 0); subs.add(run); setTimeout(run); return () => subs.delete(run); },
    watchDoc: (col, id, cb) => { const run = () => { const d = coll(col)[id]; cb(d ? {id, ...d} : null); }; subs.add(run); setTimeout(run); return () => subs.delete(run); },
    fetch: (col, f) => Promise.resolve(list(col, f)),
    getDoc: (col, id) => { const d = coll(col)[id]; return Promise.resolve(d ? {id, ...d} : null); },
    raw: () => data,
    reset: () => { data = {}; ls.set('rpm_demo', data); }
  };
}

function seedOps(withStock) {
  const st = {live: 45, dressed: 10, cut: 3, offal: 2, egg: 120};
  return SEED.map((p, i) => ({type: 'put', col: 'products', id: DB.newId('products'),
    data: {...p, sort: i + 1, active: true, stock: withStock ? (p.name === 'Country Chicken' ? 6 : st[p.cat] || 0) : 0, createdAt: Date.now()}}));
}

function makeFBAuth() {
  const auth = firebase.auth();
  return {
    onChange: cb => auth.onAuthStateChanged(u => cb(u ? {uid: u.uid} : null)),
    login: (u, pw) => auth.signInWithEmailAndPassword(toEmail(u), pw),
    logout: () => auth.signOut(),
    async signupOwner({shop, name, user, pw}) {
      S.signingUp = true;
      const cred = await auth.createUserWithEmailAndPassword(toEmail(user), pw);
      const uid = cred.user.uid;
      try {
        await DB.batch([
          {type: 'put', col: 'meta', id: 'shop', data: {name: shop, ownerUid: uid, footer: 'Thank you! Visit again', createdAt: Date.now()}},
          {type: 'put', col: 'users', id: uid, data: {name, username: user.toLowerCase(), role: 'owner', active: true, createdAt: Date.now()}}
        ]);
      } catch (e) { S.signingUp = false; await cred.user.delete().catch(() => {}); throw e; }
      await DB.batch(seedOps(false)).catch(e => console.warn('seed', e));
      S.signingUp = false;
    },
    async createStaff({name, user, pw, role}) {
      const sec = firebase.apps.find(a => a.name === 'staff') || firebase.initializeApp(CFG, 'staff');
      const sa = sec.auth();
      await sa.setPersistence(firebase.auth.Auth.Persistence.NONE);
      const cred = await sa.createUserWithEmailAndPassword(toEmail(user), pw);
      try { await DB.put('users', cred.user.uid, {name, username: user.toLowerCase(), role, active: true, createdAt: Date.now(), createdBy: S.me.uid}); }
      finally { await sa.signOut().catch(() => {}); }
    },
    async changePassword(oldPw, newPw) {
      const u = auth.currentUser;
      await u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email, oldPw));
      await u.updatePassword(newPw);
    }
  };
}

/* ---------- state & session ---------- */
const S = {me: null, shop: {}, products: [], sales: [], purchases: [], expenses: [], pend: {}, cart: [], disc: '', pay: 'cash', cust: {name: '', phone: ''}, day: dayKey(), route: 'home'};
const can = {mgr: () => ['owner', 'manager'].includes(S.me && S.me.role), owner: () => (S.me && S.me.role) === 'owner'};
let unsubs = [], dayUnsubs = [], viewUnsubs = [], V = {};

function stopWatches() { [...unsubs, ...dayUnsubs, ...viewUnsubs].forEach(u => { try { u(); } catch (e) {} }); unsubs = []; dayUnsubs = []; viewUnsubs = []; }

function startSession(u) {
  stopWatches(); S.me = null;
  if (!u) { S.uid = null; return vLogin(); }
  S.uid = u.uid;
  const cached = ls.get('rpm_me_' + u.uid, null);
  if (cached && cached.active !== false) { S.me = cached; startData(); }
  else showMsg(S.signingUp ? 'Setting up your shop…' : 'Loading your account…');
  unsubs.push(DB.watchDoc('users', u.uid, p => {
    if (!p) {
      if (S.signingUp || S.me) return;
      return showMsg('This login is not registered as shop staff. Ask the owner to add you.', true);
    }
    if (p.active === false) { ls.del('rpm_me_' + u.uid); toast('Your login has been disabled by the owner', true); AUTH.logout(); return; }
    const first = !S.me; const roleChanged = S.me && S.me.role !== p.role;
    S.me = {uid: u.uid, ...p}; ls.set('rpm_me_' + u.uid, S.me);
    if (first) startData(); else if (roleChanged) { subscribeDay(); go(); }
  }));
}

function startData() {
  S.day = dayKey();
  unsubs.push(DB.watchDoc('meta', 'shop', d => { S.shop = d || {}; onData(); }));
  unsubs.push(DB.watch('products', [], d => { S.products = d.sort((a, b) => (num(a.sort) - num(b.sort)) || String(a.name).localeCompare(b.name)); onData(); }));
  subscribeDay();
  $('#top').classList.remove('hidden'); $('#nav').classList.remove('hidden');
  go();
}

function subscribeDay() {
  dayUnsubs.forEach(u => { try { u(); } catch (e) {} }); dayUnsubs = []; S.pend = {}; S.purchases = []; S.expenses = [];
  const f = [['day', '==', S.day]];
  dayUnsubs.push(DB.watch('sales', f, (d, p) => { S.sales = d.sort((a, b) => b.at - a.at); S.pend.sales = p; onData(); }));
  if (can.mgr()) {
    dayUnsubs.push(DB.watch('purchases', f, (d, p) => { S.purchases = d.sort((a, b) => b.at - a.at); S.pend.purchases = p; onData(); }));
    dayUnsubs.push(DB.watch('expenses', f, (d, p) => { S.expenses = d.sort((a, b) => b.at - a.at); S.pend.expenses = p; onData(); }));
  }
}
setInterval(() => { if (S.me && dayKey() !== S.day) { S.day = dayKey(); subscribeDay(); go(); } }, 60000);

function pendingCount() { return Object.values(S.pend).reduce((a, b) => a + (b || 0), 0); }
function onData() { updateHeader(); if (V && V.update) { try { V.update(); } catch (e) { console.error(e); } } }

async function signOut() {

function openItemSheet(pid) {
  const p = S.products.find(x => x.id === pid); if (!p) return;
  const isKg = p.unit === 'kg'; let mode = 'qty';
  const canRate = can.mgr() || !!S.shop.cashierRateEdit;
  sheet(`<div class="row between"><h3 style="margin:0">${esc(p.name)}</h3><span class="muted">${qtyTxt(p.stock, p.unit)} in stock</span></div><div style="height:12px"></div>
    ${isKg ? '<div class="seg" id="mseg"><button data-m="qty" class="on">By weight (kg)</button><button data-m="amt">By amount (₹)</button></div>' : ''}
    <label class="field"><span id="lblIn">${isKg ? 'Weight in kg' : 'Quantity'}</span><input id="inV" inputmode="decimal" autocomplete="off" placeholder="0" style="font-size:24px;font-weight:700"></label>
    <div class="chips" id="chips"></div>
    <label class="field"><span>Rate per ${esc(p.unit)} ${canRate ? '' : '(fixed by manager)'}</span><input id="inR" inputmode="decimal" value="${num(p.rate)}" ${canRate ? '' : 'readonly'}></label>
    <div class="calc" id="calc">&nbsp;</div>
    <button class="btn primary big" id="addBtn">Add to bill</button>`);
  const chipsFor = () => mode === 'amt' ? [50, 100, 150, 200, 250, 300, 500] : isKg ? [0.25, 0.5, 0.75, 1, 1.5, 2, 3] : [1, 2, 6, 10, 12, 30];
  const calc = () => {
    const v = num($('#inV').value), r = num($('#inR').value); let q, a;
    if (mode === 'amt') { a = r2(v); q = r > 0 ? r3(v / r) : 0; } else { q = r3(v); a = r2(q * r); }
    $('#calc').innerHTML = q > 0 && r > 0 ? `${qtyTxt(q, p.unit)} × ${money(r)} = <b>${money(a)}</b>` : '&nbsp;';
    return {q, a, r};
  };
  const drawChips = () => {
    $('#chips').innerHTML = chipsFor().map(c => `<button class="chip" data-v="${c}">${mode === 'amt' ? '₹' + c : c + (isKg ? ' kg' : '')}</button>`).join('');
    $$('#chips .chip').forEach(b => b.onclick = () => { $('#inV').value = b.dataset.v; calc(); });
  };
  if (isKg) $$('#mseg button').forEach(b => b.onclick = () => {
    mode = b.dataset.m; $$('#mseg button').forEach(x => x.classList.toggle('on', x === b));
    $('#lblIn').textContent = mode === 'amt' ? 'Amount customer wants (₹)' : 'Weight in kg'; $('#inV').value = ''; drawChips(); calc(); $('#inV').focus();
  });
  const add = () => {
    const {q, a, r} = calc();
    if (!(q > 0) || !(r > 0)) return toast(isKg ? 'Enter the weight' : 'Enter the quantity', true);
    S.cart.push({pid: p.id, name: p.name, unit: p.unit, qty: q, rate: r2(r), amount: a});
    closeSheet(); drawCart();
  };
  $('#inV').oninput = calc; $('#inR').oninput = calc;
  $('#inV').onkeydown = e => { if (e.key === 'Enter') add(); };
  $('#addBtn').onclick = add;
  drawChips(); setTimeout(() => { const i = $('#inV'); if (i) i.focus(); }, 60);
}
function cartTotals() { const sub = r2(S.cart.reduce((a, i) => a + i.amount, 0)); const disc = Math.min(Math.max(num(S.disc), 0), sub); return {sub, disc: r2(disc), total: r2(sub - disc)}; }
function drawCart() {
  const el = $('#cart'); if (!el) return;

function saveBill() {
  if (!S.cart.length) return;
  if (S.pay === 'credit' && !S.cust.name.trim()) return toast('Enter the customer name for a credit sale', true);
  const t = cartTotals(); const now = Date.now(); const id = DB.newId('sales');
  const bill = {billNo: nextBillNo(), day: dayKey(new Date(now)), at: now, items: S.cart.map(i => ({...i})), subtotal: t.sub, discount: t.disc, total: t.total,
    pay: S.pay, customer: S.cust.name.trim(), phone: S.cust.phone.trim(), byUid: S.me.uid, byName: S.me.name, device: deviceCode(), status: 'ok'};
  const qty = {}; bill.items.forEach(i => qty[i.pid] = r3((qty[i.pid] || 0) + i.qty));
  const ops = [{type: 'put', col: 'sales', id, data: bill}, ...Object.entries(qty).map(([pid, q]) => ({type: 'patch', col: 'products', id: pid, data: {stock: INC(-q)}}))];
  // local safety copy of every bill on this phone (last 500)
  const log = ls.get('rpm_billlog', []); log.push({id, ...bill}); ls.set('rpm_billlog', log.slice(-500));
  DB.batch(ops).catch(e => toast('Bill ' + bill.billNo + ' could not sync: ' + authMsg(e), true));
  S.cart = []; S.disc = ''; S.cust = {name: '', phone: ''}; S.pay = 'cash';
  drawCart(); showReceipt({id, ...bill}); toast('Bill saved');
}

function vProcess(view) {
  const ps = S.products.filter(p => p.active !== false && p.unit === 'kg');
  const srcs = ps.filter(p => p.cat === 'live'); const outs = ps.filter(p => p.cat !== 'live');
  if (!srcs.length) { view.innerHTML = '<div class="alert warn">Add a product with category "Live bird" in Rates &amp; products first.</div>'; return {}; }
  view.innerHTML = `<h2>Processing (live → dressed)</h2>
    <div class="alert info" style="font-size:13px">Optional. Use this only when you dress live birds yourself. Shops that buy dressed chicken can skip it.</div>
    <form class="card" id="xf"><label class="field"><span>From</span><select id="xs">${srcs.map(p => `<option value="${esc(p.id)}">${esc(p.name)} · ${qtyTxt(p.stock, 'kg')} in stock</option>`).join('')}</select></label>
      <div class="grid2"><label class="field"><span>Birds</span><input id="xb" inputmode="numeric"></label><label class="field"><span>Live weight used (kg)</span><input id="xi" inputmode="decimal" required></label></div>
      <div class="sec" style="margin-top:4px">Output weight (kg)</div>
      ${outs.map(p => `<label class="row between field"><span style="flex:1">${esc(p.name)}</span><input class="small xo" data-id="${esc(p.id)}" inputmode="decimal" placeholder="0"></label>`).join('')}

      <button class="btn primary big">Save processing</button></form>
    <div class="sec">Today's processing</div><div id="xl"></div>`;
  const calc = () => {
    const inKg = num($('#xi').value); const out = r3($$('.xo').reduce((a, i) => a + num(i.value), 0)); const waste = r3(inKg - out);
    const y = inKg ? r2(out / inKg * 100) : 0;
    $('#xr').innerHTML = `<div class="row between"><span>Output</span><b>${out.toFixed(3)} kg</b></div><div class="row between"><span>Yield</span><b class="${y && (y < 60 || y > 85) ? 'bad' : ''}">${y}%</b></div><div class="row between"><span>Waste / loss</span><b class="${waste < 0 ? 'bad' : ''}">${waste.toFixed(3)} kg</b></div>`;
    return {inKg: r3(inKg), out, waste, y};
  };
  $$('#xf input').forEach(i => i.oninput = calc); calc();
  $('#xf').onsubmit = e => {
    e.preventDefault(); const c = calc(); const src = S.products.find(p => p.id === $('#xs').value);
    if (c.inKg <= 0 || c.out <= 0) return toast('Enter live weight and at least one output', true);

/* ---------- REPORTS ---------- */
function vReports(view) {
  let from = S.day, to = S.day, data = null;
  const presets = {today: 'Today', yest: 'Yesterday', d7: 'Last 7 days', month: 'This month', lmonth: 'Last month', custom: 'Custom'};
  view.innerHTML = `<h2>Reports</h2><div class="chips" id="rpre">${Object.entries(presets).map(([k, v], i) => `<button class="chip ${i ? '' : 'on'}" data-k="${k}">${v}</button>`).join('')}</div>
    <div class="grid2 hidden" id="rcus"><label class="field"><span>From</span><input type="date" id="rf"></label><label class="field"><span>To</span><input type="date" id="rt"></label></div><div id="rep"></div>`;
  const setP = k => {
    const t = S.day;
    if (k === 'today') from = to = t; else if (k === 'yest') from = to = addDays(t, -1); else if (k === 'd7') { from = addDays(t, -6); to = t; }
    else if (k === 'month') { from = t.slice(0, 8) + '01'; to = t; } else if (k === 'lmonth') { to = addDays(t.slice(0, 8) + '01', -1); from = to.slice(0, 8) + '01'; }
    $('#rcus').classList.toggle('hidden', k !== 'custom'); $('#rf').value = from; $('#rt').value = to; load();
  };
  $$('#rpre .chip').forEach(b => b.onclick = () => { $$('#rpre .chip').forEach(x => x.classList.toggle('on', x === b)); setP(b.dataset.k); });
  $('#rf').onchange = $('#rt').onchange = () => { from = $('#rf').value; to = $('#rt').value; if (from && to && from <= to) load(); };
  async function load() {
    $('#rep').innerHTML = '<p class="muted center">Loading…</p>';
    const f = [['day', '>=', from], ['day', '<=', to]];
    try { const [sa, pu, ex, pr, ad] = await Promise.all(['sales', 'purchases', 'expenses', 'processing', 'adjustments'].map(c => DB.fetch(c, f))); data = {sa, pu, ex, pr, ad}; draw(); }
    catch (e) { $('#rep').innerHTML = `<div class="alert bad">Could not load: ${esc(authMsg(e))}</div>`; }
  }
  function draw() {
    const {sa, pu, ex, pr, ad} = data; const ok = sa.filter(okSale), vd = sa.filter(s => !okSale(s));
    const sales = sum(ok, 'total'), purch = sum(pu, 'amount'), exp = sum(ex, 'amount'), profit = r2(sales - purch - exp);
    const group = (arr, key, val) => { const m = {}; arr.forEach(x => { const k = key(x); m[k] = m[k] || {k, n: 0, q: 0, a: 0}; m[k].n++; m[k].q += num(val ? val(x).q : 0); m[k].a += num(val ? val(x).a : x.total ?? x.amount); }); return Object.values(m).sort((a, b) => b.a - a.a); };
    const lines = ok.flatMap(s => s.items.map(i => ({...i, s})));
    const byProd = group(lines, l => l.name + '|' + l.unit, l => ({q: l.qty, a: l.amount}));
    const byPay = group(ok, s => PAY[s.pay] || s.pay), byStaff = group(ok, s => s.byName), byExp = group(ex, x => x.cat);
    const liveP = pu.filter(x => x.unit === 'kg'), liveKg = sum(liveP, 'qty'); const credit = ok.filter(s => s.pay === 'credit'); const due = sum(pu, 'due');
    const inKg = sum(pr, 'inKg'), outKg = sum(pr, 'outKg');
    const days = []; for (let d = from, i = 0; d <= to && i < 62; d = addDays(d, 1), i++) days.push(d);
    const daily = days.map(d => { const s = sum(ok.filter(x => x.day === d), 'total'), p = sum(pu.filter(x => x.day === d), 'amount'), e = sum(ex.filter(x => x.day === d), 'amount'); return {d, n: ok.filter(x => x.day === d).length, s, p, e, pf: r2(s - p - e)}; }).filter(r => r.n || r.p || r.e);
    const tbl = (head, rows) => `<div class="tblwrap"><table><tr>${head.map((h, i) => `<th class="${i ? 'n' : ''}">${h}</th>`).join('')}</tr>${rows.map(r => `<tr>${r.map((c, i) => `<td class="${i ? 'n' : ''}">${c}</td>`).join('')}</tr>`).join('')}</table></div>`;
    const title = from === to ? dateTxt(from) : `${dateTxt(from)} – ${dateTxt(to)}`;
    $('#rep').innerHTML = `<div id="repBody"><h3>${esc(S.shop.name || '')} · ${title}</h3>
      <div class="kpis">${kpi('Sales', money(sales), pl(ok.length, 'bill') + ' · avg ' + money(ok.length ? sales / ok.length : 0), true)}${kpi('Purchases', money(purch), r3(liveKg).toFixed(1) + ' kg' + (liveKg ? ' · ' + money(sum(liveP, 'amount') / liveKg) + '/kg' : ''))}${kpi('Expenses', money(exp), (ex.length === 1 ? '1 entry' : ex.length + ' entries'))}${kpi('Est. profit', `<span class="${profit < 0 ? 'bad' : 'ok'}">${money(profit)}</span>`, 'sales − purchases − expenses')}</div>
      ${vd.length ? `<div class="alert warn">${vd.length} voided bill(s) worth ${money(sum(vd, 'total'))} excluded.</div>` : ''}
      <div class="sec">By product</div><div class="card">${byProd.length ? tbl(['Product', 'Qty', 'Amount'], byProd.map(r => { const [n, u] = r.k.split('|'); return [esc(n), qtyTxt(r.q, u), money(r.a)]; })) : '<p class="muted">No sales.</p>'}</div>
      <div class="grid2 r1" style="align-items:start"><div><div class="sec">By payment</div><div class="card">${tbl(['Mode', 'Bills', 'Amount'], byPay.map(r => [r.k, r.n, money(r.a)]))}</div></div>
        <div><div class="sec">By staff</div><div class="card">${tbl(['Staff', 'Bills', 'Amount'], byStaff.map(r => [esc(r.k), r.n, money(r.a)]))}</div></div></div>
      <div class="sec">Expenses</div><div class="card">${byExp.length ? tbl(['Category', 'Entries', 'Amount'], byExp.map(r => [esc(r.k), r.n, money(r.a)])) : '<p class="muted">No expenses.</p>'}</div>
      ${pr.length ? `<div class="sec">Processing</div><div class="card"><div class="row between"><span>Live used → output</span><b>${r3(inKg).toFixed(1)} kg → ${r3(outKg).toFixed(1)} kg</b></div><div class="row between"><span>Average yield</span><b>${inKg ? r2(outKg / inKg * 100) : 0}%</b></div></div>` : ''}
      ${credit.length ? `<div class="sec">Credit sales (to collect)</div><div class="card">${tbl(['Customer', 'Bill', 'Amount'], credit.map(s => [esc(s.customer) + (s.phone ? ' · ' + esc(s.phone) : ''), esc(s.billNo), money(s.total)]))}</div>` : ''}
      ${due ? `<div class="alert warn">Supplier balance due for this period: <b>${money(due)}</b></div>` : ''}
      ${ad.length ? `<div class="sec">Stock adjustments</div><div class="card">${tbl(['Item', 'Change', 'Reason / by'], ad.map(a => [esc(a.name), (a.change > 0 ? '+' : '') + qtyTxt(a.change, a.unit), esc(a.reason) + ' · ' + esc(a.byName)]))}</div>` : ''}
      ${days.length > 1 && daily.length ? `<div class="sec">Day by day</div><div class="card">${tbl(['Day', 'Bills', 'Sales', 'Purch.', 'Exp.', 'Profit'], daily.map(r => [dateTxt(r.d), r.n, money(r.s), money(r.p), money(r.e), money(r.pf)]))}</div>` : ''}
      <p class="muted" style="font-size:12px">Estimated profit is a simple cash view: everything bought in the period counts as cost, even if some is still in stock.</p></div>
      <div class="row wrap gap noprint"><button class="btn" id="cs1">⬇ Sales CSV</button><button class="btn" id="cs2">⬇ Daily summary CSV</button><button class="btn" id="cs3">🖨️ Print / PDF</button></div>`;
    $('#cs1').onclick = () => downloadCSV(`sales_${from}_${to}.csv`, [['Date', 'Time', 'Bill No', 'Staff', 'Device', 'Payment', 'Customer', 'Phone', 'Product', 'Qty', 'Unit', 'Rate', 'Line amount', 'Bill discount', 'Bill total', 'Status'],
      ...sa.sort((a, b) => a.at - b.at).flatMap(s => s.items.map((i, ix) => [s.day, timeTxt(s.at), s.billNo, s.byName, s.device, PAY[s.pay], s.customer, s.phone, i.name, i.qty, i.unit, i.rate, i.amount, ix ? '' : s.discount, ix ? '' : s.total, s.status]))]);
    $('#cs2').onclick = () => downloadCSV(`summary_${from}_${to}.csv`, [['Date', 'Bills', 'Sales', 'Purchases', 'Expenses', 'Est. profit'], ...daily.map(r => [r.d, r.n, r.s, r.p, r.e, r.pf])]);
    $('#cs3').onclick = () => printHTML($('#repBody').innerHTML, true);
  }
  setP('today');
  return {};
}

/* ---------- DAY CLOSING ---------- */
function vClosing(view) {
  const day = S.day; let saved = null;
  view.innerHTML = `<h2>Day closing · ${dateTxt(day)}</h2><div id="cb"></div>`;
  const draw = () => {
    const ok = S.sales.filter(okSale);
    const cashS = sum(ok.filter(s => s.pay === 'cash'), 'total'), upiS = sum(ok.filter(s => s.pay === 'upi'), 'total'), credS = sum(ok.filter(s => s.pay === 'credit'), 'total');
    const cashE = sum(S.expenses.filter(x => x.pay !== 'upi'), 'amount'), cashP = sum(S.purchases.filter(x => x.payMode === 'cash'), 'paid');
    const opening = $('#co') ? num($('#co').value) : num(saved ? saved.opening : 0);
    const counted = $('#cc') ? $('#cc').value : (saved ? String(saved.counted) : '');
    const exp = r2(opening + cashS - cashE - cashP), diff = counted === '' ? null : r2(num(counted) - exp);
    $('#cb').innerHTML = `${saved ? `<div class="alert info">Closed by ${esc(saved.byName)} at ${timeTxt(saved.at)}. You can update and save again.</div>` : ''}
      <div class="card"><label class="row between field"><span>Opening cash in drawer</span><input id="co" class="small" inputmode="decimal" value="${opening || ''}" placeholder="0"></label>
        <div class="row between"><span>+ Cash sales</span><b>${money(cashS)}</b></div>
        <div class="row between" style="margin-top:6px"><span>− Cash expenses</span><b>${money(cashE)}</b></div>
        <div class="row between" style="margin-top:6px"><span>− Cash paid to suppliers</span><b>${money(cashP)}</b></div>
        <div class="row between grand" style="border-top:1px solid var(--ln);margin-top:8px"><span>Expected cash</span><b>${money(exp)}</b></div>
        <label class="row between field"><span><b>Cash counted now</b></span><input id="cc" class="small" inputmode="decimal" value="${esc(counted)}" style="font-size:18px"></label>
        <div class="row between grand"><span>Difference</span><b class="${diff == null ? '' : diff < 0 ? 'bad' : 'ok'}">${diff == null ? '—' : (diff > 0 ? '+' : '') + money(diff)}</b></div>
        <label class="field"><span>Note</span><input id="cn" value="${esc(saved ? saved.note || '' : '')}" placeholder="reason for difference, if any"></label>
        <button class="btn primary big" id="cs">Save closing</button></div>
      <div class="card"><div class="row between"><span>UPI sales (check bank app)</span><b>${money(upiS)}</b></div><div class="row between" style="margin-top:6px"><span>Credit sales</span><b>${money(credS)}</b></div><div class="row between" style="margin-top:6px"><span>Total sales</span><b>${money(cashS + upiS + credS)}</b></div></div>`;
    ['#co', '#cc'].forEach(s => $(s).onchange = draw);
    $('#cs').onclick = () => {
      if ($('#cc').value === '') return toast('Enter the cash counted', true);
      DB.put('closing', day, {day, at: Date.now(), opening, cashSales: cashS, upiSales: upiS, creditSales: credS, cashExpenses: cashE, cashPurchases: cashP, expected: exp, counted: num($('#cc').value), diff: r2(num($('#cc').value) - exp), note: $('#cn').value.trim(), byUid: S.me.uid, byName: S.me.name})
        .catch(e => toast(authMsg(e), true));
      toast('Day closing saved');
    };
  };
  viewUnsubs.push(DB.watchDoc('closing', day, d => { saved = d; draw(); }));
  return {update: () => { if (document.activeElement && document.activeElement.tagName === 'INPUT') return; draw(); }};
}

      <label class="field"><span>Shop name</span><input id="s1" value="${esc(sh.name || '')}" required></label>
      <label class="field"><span>Address</span><input id="s2" value="${esc(sh.address || '')}"></label>
      <div class="grid2"><label class="field"><span>Phone</span><input id="s3" value="${esc(sh.phone || '')}" inputmode="tel"></label><label class="field"><span>GSTIN (if registered)</span><input id="s4" value="${esc(sh.gstin || '')}"></label></div>
      <label class="field"><span>Bill footer</span><input id="s5" value="${esc(sh.footer || '')}"></label>
      <label class="row field"><input type="checkbox" id="s6" ${sh.cashierRateEdit ? 'checked' : ''}> Allow cashiers to change the rate on a bill</label>
      <button class="btn primary full">Save shop details</button></form>` : ''}
    <h2>This phone</h2><div class="card">
      <label class="field"><span>Phone code (printed in bill numbers, keep it different on each phone)</span><input id="dv" value="${esc(deviceCode())}" maxlength="4" autocapitalize="characters"></label>
      <label class="field"><span>Bill printer paper</span><select id="pw"><option value="58">58 mm (2 inch)</option><option value="80">80 mm (3 inch)</option></select></label>
      <button class="btn full" id="dvs">Save phone settings</button>
      <button class="btn full" id="bk" style="margin-top:10px">⬇ Download backup of bills made on this phone</button></div>
    ${MODE === 'fb' ? `<h2>My password</h2><form class="card" id="pwf"><label class="field"><span>Current password</span><input type="password" id="p1" required></label><label class="field"><span>New password (min 6)</span><input type="password" id="p2" minlength="6" required></label><button class="btn full">Change password</button></form>` : ''}
    ${MODE === 'demo' ? '<div class="card"><button class="btn danger full" id="dr">Reset demo data</button><button class="btn ghost" id="dx">Exit demo mode</button></div>' : ''}
    <button class="btn full" id="so2">Sign out</button>
    <p class="center muted" style="font-size:12px">RetailPro Mini v${VER} · ${MODE === 'fb' ? 'Firebase: ' + esc(CFG.projectId) : 'Demo mode (data on this phone only)'}</p>`;
  $('#pw').value = String(ls.get('rpm_paper', 58));
  if (own) $('#shf').onsubmit = e => { e.preventDefault(); DB.put('meta', 'shop', {name: $('#s1').value.trim(), address: $('#s2').value.trim(), phone: $('#s3').value.trim(), gstin: $('#s4').value.trim().toUpperCase(), footer: $('#s5').value.trim(), cashierRateEdit: $('#s6').checked}, true).catch(er => toast(authMsg(er), true)); toast('Shop details saved'); };
  $('#dvs').onclick = () => { const c = $('#dv').value.trim().toUpperCase().replace(/[^A-Z0-9]/g, ''); if (!c) return toast('Enter a code like C1', true); ls.set('rpm_dev', c); ls.set('rpm_paper', +$('#pw').value); toast('Saved'); };
  $('#bk').onclick = () => downloadFile(`bills_backup_${deviceCode()}_${S.day}.json`, JSON.stringify(ls.get('rpm_billlog', []), null, 1), 'application/json');
  if ($('#pwf')) $('#pwf').onsubmit = async e => { e.preventDefault(); try { await AUTH.changePassword($('#p1').value, $('#p2').value); toast('Password changed'); $('#p1').value = $('#p2').value = ''; } catch (er) { toast(authMsg(er), true); } };
  if ($('#dr')) $('#dr').onclick = () => { if (confirm('Delete all demo data?')) { DB.reset(); ls.del('rpm_demo_uid'); location.reload(); } };
  if ($('#dx')) $('#dx').onclick = () => { ls.del('rpm_demo_on'); ls.del('rpm_demo_uid'); location.reload(); };
  $('#so2').onclick = signOut;
  return {};
}

/* ---------- boot ---------- */
async function boot() {
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(e => console.warn('SW', e));
  if (MODE === 'setup') return vSetup();
  if (MODE === 'fb') {
    try { await loadFirebase(); } catch (e) {
      $('#view').innerHTML = `<div class="login card center"><div class="logo">🐔</div><p>Could not start. Open the app once with internet so it can be saved on this phone.</p><button class="btn" onclick="location.reload()">Try again</button></div>`; return;
    }
    DB = makeFB(); AUTH = makeFBAuth();
  } else { DB = makeDemo(); AUTH = makeDemoAuth(); }
  AUTH.onChange(startSession);
}
async function loadFirebase() {
  const b = `https://www.gstatic.com/firebasejs/${FB_VER}/`;
  await loadScript(b + 'firebase-app-compat.js');
  await Promise.all([loadScript(b + 'firebase-auth-compat.js'), loadScript(b + 'firebase-firestore-compat.js')]);
}
boot();
</script>
</body>
</html>
